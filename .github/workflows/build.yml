name: Build Android Debug

on:
  push:
    branches: [ main, cmp-rewrite ]
  pull_request:
    branches: [ main, cmp-rewrite ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --no-build-cache --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
